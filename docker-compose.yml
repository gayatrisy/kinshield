services:
  api:
    build: .
    env_file: .env
    environment: ["KINSHIELD_EMBEDDED_WORKER=0"]
    ports: ["8000:8000"]
    volumes: ["kinshield-data:/data"]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "kinshield.worker"]
    environment: ["KINSHIELD_EMBEDDED_WORKER=0"]
    volumes: ["kinshield-data:/data"]
    restart: unless-stopped
    depends_on: [api]
volumes:
  kinshield-data:
